<html lang="en">

<body class="admin-auth">

        <section class="auth-card"><a class="brand" href="index.html"><span>ADDIS</span> EATS</a>

            </form><small>Demo: <strong>admin</strong> / <strong>admin123</strong></small><a class="back-link"
